{% if show_icon %}
<label for="pesquisa-{{ autocomplete_id }}" class="cursor-text absolute top-1/2 left-6 -translate-x-1/2 -translate-y-1/2">
    <div class="bg-sec size-9 rounded-full"></div>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3.5"
        stroke="currentColor"
        class="size-4 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-radar">
        <path stroke-linecap="round" stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
    </svg>
</label>
{% endif %}

<!-- wrapper é o ponto de referência do JS — NÃO REMOVE -->
<div class="js-autocomplete-wrapper contents">
    <input
        id="pesquisa-{{ autocomplete_id }}"
        autocomplete="off"
        name="pesquisa"
        class="{{ input_class }} peer outline-none js-autocomplete-input"
        type="text"
        placeholder="{{ input_placeholder }}">

    <div class="absolute top-1/2 bg-white w-full h-1/2 hidden js-autocomplete-overlay -z-1"></div>
    <div class="absolute top-full bg-white w-full h-fit text-black rounded-b-3xl hidden js-autocomplete-dropdown flex-col overflow-hidden border-t border-gray-200 shadow-xl max-h-100 overflow-y-auto scrollbar-thin scrollbar-thumb-radar">
    
    
        <div class="js-autocomplete-loading items-center justify-center gap-2 py-5 text-gray-400" style="display:none">
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 3 2.373 3 5.373 3 5.373 0 7.646 0 12h4z"></path>
            </svg>
            <span class="text-sm">Buscando...</span>
        </div>

        <ul class="js-autocomplete-list list-none p-0 pb-3 m-0 w-full divide-y divide-gray-100
            [&>li>a]:w-full [&>li>a]:flex [&>li>a]:items-center [&>li>a]:gap-3 [&>li>a]:px-3 [&>li>a]:py-3 [&>li>a]:hover:bg-gray-100 [&>li>a]:transition-colors
            [&>li>a>img]:w-11 [&>li>a>img]:h-11 [&>li>a>img]:rounded-full [&>li>a>img]:object-cover
            [&>li>a>div]:flex [&>li>a>div]:flex-col [&>li>a>div]:min-w-0
            [&>li>a>div>span:first-child]:font-light [&>li>a>div>span:first-child]:text-gray-900 [&>li>a>div>span:first-child]:truncate [&>li>a>div>span:first-child]:text-sm [&>li>a>div>span:first-child]:lg:text-base
            [&>li>a>div>span:last-child]:text-gray-500 [&>li>a>div>span:last-child]:text-xs [&>li>a>div>span:last-child]:lg:text-sm [&>li>a>div>span:last-child]:truncate [&>li>a>div>span:last-child]:capitalize">
        </ul>
    </div>
</div>
