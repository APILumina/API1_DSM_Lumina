<script>
    let ultimoScroll = 0;
    const navbarItem = document.getElementById('bottom-navbar');

    window.addEventListener('scroll', () => {
        const scrollAtual = window.pageYOffset || document.documentElement.scrollTop;

        // Garante que a barra fique visível no topo da página
        if (scrollAtual <= 0) {
            navbarItem.classList.remove('translate-y-full', 'opacity-0');
            return;
        }

        // Se rolar para baixo, esconde a barra deslizando e sumindo
        if (scrollAtual > ultimoScroll && !navbarItem.classList.contains('translate-y-full')) {
            navbarItem.classList.add('translate-y-full', 'opacity-0');
        } 
        // Se rolar para cima, mostra a barra subindo e aparecendo
        else if (scrollAtual < ultimoScroll && navbarItem.classList.contains('translate-y-full')) {
            navbarItem.classList.remove('translate-y-full', 'opacity-0');
        }

        ultimoScroll = scrollAtual;
    });
</script>
