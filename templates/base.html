<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Passion+One&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
        @theme {
            --color-radar: #1A249D;
            --color-dark-blue: #081638;
            --color-sec: #efc33c;
            --color-verde: #34C560;
        }
        .shadow-card { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
    </style>

    {% block extra_style %}{% endblock %}
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
    {% include 'partials/_navbar.html' %}

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!--Footer-->
    <footer class="bg-radar text-white mt-8 py-8">
        <div class="max-w-6xl mx-auto px-5 flex flex-col items-center">
            <h1 class="text-lg font-bold tracking-widest">RADAR CIDADÃO</h1>

            <!-- Github-->
            <a href="https://github.com/APILumina/API1_DSM_Lumina" target="_blank" class="hover:opacity-70 transition my-3">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
            </a>

            <!--Contato -->
            <div class="flex items-center gap-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
                fatec.luminaapi@gmail.com
            </div>

            <!-- Links de navegação -->
            <nav class="flex gap-6 text-sm font-medium">
                <a href="/" class="hover:underline">Página inicial</a>
                <a href="/deputados" class="hover:underline">Deputados</a>
                <a href="/graficos" class="hover:underline">Gráficos</a>
                <a href="/sobre" class="hover:underline">Sobre</a>
            </nav>

            <!-- Copyright -->
            <p class="text-sm">© 2026 Lumina - Código aberto sob licença MIT</p>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("btn-deputados");
            const menu = document.getElementById("menu-deputados");
            const seta = document.getElementById("seta");

            if (btn && menu) {
                seta.addEventListener("click", (e) => {
                    e.stopPropagation();
                    menu.classList.toggle("hidden");
                    seta.classList.toggle("rotate-180");
                });

                document.addEventListener("click", (e) => {
                    if (!menu.contains(e.target) && !btn.contains(e.target)) {
                        menu.classList.add("hidden");
                        seta.classList.remove("rotate-180");
                    }
                });
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
