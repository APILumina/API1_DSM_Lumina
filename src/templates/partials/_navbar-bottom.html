<script>
  let ultimoScroll = 0;
  const navbarItem = document.getElementById('bottom-navbar');
  
  // Elementos do Dropup
  const btnDesempenho = document.getElementById('btn-desempenho');
  const dropupMenu = document.getElementById('dropup-menu');
  const dropupOverlay = document.getElementById('dropup-overlay');

  // Função para abrir o Dropup
  function abrirDropup() {
      // Exibe o fundo escuro suavemente
      dropupOverlay.classList.remove('hidden');
      setTimeout(() => dropupOverlay.classList.remove('opacity-0'), 10);

      // Faz o menu subir da parte inferior da tela
      dropupMenu.classList.remove('translate-y-full', 'opacity-0');
  }

  // Função para fechar o Dropup
  function fecharDropup() {
      // Esconde o fundo escuro suavemente
      dropupOverlay.classList.add('opacity-0');
      setTimeout(() => dropupOverlay.classList.add('hidden'), 300);

      // Faz o menu descer e sumir
      dropupMenu.classList.add('translate-y-full', 'opacity-0');
  }

  // Alterna entre abrir e fechar ao clicar no botão Desempenho
  btnDesempenho.addEventListener('click', (e) => {
      e.preventDefault(); 

      const estaAberto = !dropupMenu.classList.contains('translate-y-full');

      if (estaAberto) {
          fecharDropup();
      } else {
          abrirDropup();
      }
  });
  
  // Fecha o menu se clicar em qualquer área fora dele (no overlay)
  dropupOverlay.addEventListener('click', fecharDropup);

  // Monitoramento do Scroll de página
  window.addEventListener('scroll', () => {
      // Bloqueia a navbar de se esconder caso o dropup esteja visível
      if (!dropupMenu.classList.contains('translate-y-full')) return;

      const scrollAtual = window.pageYOffset || document.documentElement.scrollTop;

      // Garante que a barra fique visível no topo absoluto da tela
      if (scrollAtual <= 0) {
          navbarItem.classList.remove('translate-y-full', 'opacity-0');
          return;
      }

      // Se rolar para baixo, esconde a barra deslizando e aplicando opacidade
      if (scrollAtual > ultimoScroll && !navbarItem.classList.contains('translate-y-full')) {
          navbarItem.classList.add('translate-y-full', 'opacity-0');
      } 
      // Se rolar para cima, exibe a barra subindo e aparecendo
      else if (scrollAtual < ultimoScroll && navbarItem.classList.contains('translate-y-full')) {
          navbarItem.classList.remove('translate-y-full', 'opacity-0');
      }

      ultimoScroll = scrollAtual;
  });
</script>
