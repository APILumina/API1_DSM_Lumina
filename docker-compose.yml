version: '3.8'

services:
  # 1. Serviço do Banco de Dados (MariaDB)
  db:
    image: mariadb:10.11
    container_name: mariadb_api
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "lumina1234"  # Senha que o banco terá ao iniciar
      MARIADB_DATABASE: "Lumina2"          # Banco que será criado automaticamente
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # 2. Serviço da sua API Python
  web:
    build: .
    container_name: python_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      # IMPORTANTE: Como a API e o Banco sobem juntos no Compose,
      # o host DEVE ser o nome do serviço ("db") para eles se comunicarem internamente.
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=lumina1234
      - DB_NAME=Lumina2
    depends_on:
      - db

volumes:
  mariadb_data: # Garante que os dados do banco fiquem salvos no servidor AWS
